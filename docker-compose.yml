version: "3.4"
services:
  api:
    container_name: ieu-announcements-api
    build: .
    ports:
      - 3001:3001
    env_file:
      - .env
    depends_on:
      - mongodb
    environment:
      - DB_HOST=mongodb
    networks:
      - ieu-announcements-network

  mongodb:
    container_name: ieu-announcements-mongodb
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
      - MONGO_INITDB_DATABASE=${DB_NAME}
    volumes:
      - mongodb-data:/data/db
    networks:
      - ieu-announcements-network

volumes:
  mongodb-data:
    name: ieu-announcements-mongodb-data

networks:
  ieu-announcements-network:
    name: ieu-announcements-network
    driver: bridge
